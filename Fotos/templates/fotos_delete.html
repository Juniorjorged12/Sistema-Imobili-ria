{% extends "base.html" %}

{% block title %}Excluir foto{% endblock %}

{% block content %}
<div class="page-heading"><div><div class="page-kicker">Galeria de imagens</div><h1 class="page-title h2">Excluir foto</h1></div></div>
<div class="panel"><p>Deseja remover esta foto da galeria?</p>{% if object.imagem %}<img src="{{ object.imagem.url }}" alt="Foto que será excluída" class="img-fluid rounded-3 mb-3" style="max-height:240px">{% endif %}<p class="text-secondary">Imóvel: {{ object.imovel }}</p><form method="post">{% csrf_token %}<div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="{% url detail_url object.pk %}">Cancelar</a><button class="btn btn-danger" type="submit">Excluir foto</button></div></form></div>
{% endblock %}
