{% extends "base.html" %}

{% block title %}Detalhes da cidade{% endblock %}

{% block content %}
<div class="page-heading"><div><div class="page-kicker">Localização cadastrada</div><h1 class="page-title h2">{{ object.nome }}</h1></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" href="{% url list_url %}">Voltar</a><a class="btn btn-gold" href="{% url update_url object.pk %}">Editar cidade</a></div></div>
<div class="panel"><div class="page-kicker mb-2">Cidade</div><h2 class="h4">{{ object.nome }}</h2><p class="text-secondary mb-0">{{ object.bairros.count }} bairro(s) cadastrado(s)</p><div class="d-flex justify-content-end mt-4"><a class="btn btn-outline-danger" href="{% url delete_url object.pk %}">Excluir cidade</a></div></div>
{% endblock %}
